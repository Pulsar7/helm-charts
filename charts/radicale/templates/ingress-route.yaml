{{ include "radicale.validateValues" . }}
{{- $httpIngressRoute := .Values.httpIngressRoute -}}
{{- $namespace := .Release.Namespace | quote -}}
{{- $extraIngressRoutes := .Values.extraIngressRoutes -}}
{{- if $httpIngressRoute.enabled }}
{{- $httpService := .Values.httpService -}}
{{- $httpServicePort := $httpService.httpPort -}}
{{- $httpIngressRouteRefMiddlewares := $httpIngressRoute.refMiddlewares -}}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ $httpIngressRoute.name }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "radicale.labels" . | nindent 4 }}
spec:
  entryPoints: {{- toYaml $httpIngressRoute.entryPoints | nindent 4 }}
  routes:
  - match: {{ $httpIngressRoute.routeMatch }}
    kind: Rule
    services:
    - name: 
      port: {{ $httpServicePort.portNumber }}
      scheme: http
    {{- with $httpIngressRouteRefMiddlewares }}
    middlewares:
    {{- range $middlewareName := . }}
    - name: {{ $middlewareName }}
      namespace: {{ $namespace }}
    {{- end }}
    {{- end }}
  {{- with $httpIngressRoute.certResolver }}
  tls:
    certResolver: {{ . }}
  {{- end }}
{{- end }}
{{- if $extraIngressRoutes }}
---
{{- $labels := (include "radicale.labels" .) -}}
{{- $index := 0 -}}
{{- range $extraIngressRoute := $extraIngressRoutes }}
{{- $index = add $index 1 -}}
{{- if gt $index 1 }}
---
{{- end }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ $extraIngressRoute.name }}
  namespace: {{ $namespace }}
  labels: {{- $labels | nindent 4 }}
spec:
  entryPoints: {{- toYaml $extraIngressRoute.entryPoints | nindent 4 }}
  routes:
  - match: {{ $extraIngressRoute.routeMatch }}
    kind: Rule
    services:
    - name: {{ $extraIngressRoute.refServiceName }}
      port: {{ $extraIngressRoute.refServicePortNumber }}
      scheme: http
    {{- with $extraIngressRoute.refMiddlewares }}
    middlewares:
    {{- range $middlewareName := . }}
    - name: {{ $middlewareName }}
      namespace: {{ $namespace }}
    {{- end }}
    {{- end }}
  {{- with $extraIngressRoute.certResolver }}
  tls:
    certResolver: {{ . }}
  {{- end }}
{{- end }}
{{- end }}