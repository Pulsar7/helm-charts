{{ include "radicale.validateValues" . }}
{{- $ingressRoute := .Values.ingressRoute -}}
{{- $middlewares := .Values.middlewares -}}
{{- $middlewareNamespace := .Release.Namespace | quote -}}
{{- if $ingressRoute.enabled }}
{{- $radicaleContainer := .Values.radicaleContainer -}}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "radicale.ingressRoute" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "radicale.labels" . }}
spec:
  entryPoints: {{- toYaml $ingressRoute.entryPoints | nindent 4 }}
  routes:
  - match: {{ $ingressRoute.routeMatch }}
    kind: Rule
    services:
    - name: {{ include "radicale.service" . }}
      port: {{ index $radicaleContainer.service.ports 0 "port" }}
      scheme: http
    {{- if $middlewares }}
    middlewares:
    {{- range $middlewares }}
    - name: {{ .name | quote }}
      namespace: {{ $middlewareNamespace }}
    {{- end }}
    {{- end }}
  tls:
    certResolver: {{ .Values.ingressRoute.certResolver }}
{{- end }}
