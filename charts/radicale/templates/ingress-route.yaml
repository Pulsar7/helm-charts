{{ include "radicale.validateValues" . }}
{{- $ingressRoute := .Values.ingressRoute -}}
{{- $middlewares := .Values.middlewares -}}
{{- $namespace := .Release.Namespace | quote -}}
{{- if $ingressRoute.enabled }}
{{- $service := .Values.service -}}
{{- $servicePorts := $service.ports -}}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "radicale.ingressRouteName" . }}
  namespace: {{ $namespace }}
  labels: {{- include "radicale.labels" . | nindent 4 }}
spec:
  entryPoints: {{- toYaml $ingressRoute.entryPoints | nindent 4 }}
  routes:
  - match: {{ $ingressRoute.routeMatch }}
    kind: Rule
    services:
    - name: {{ include "radicale.serviceName" . }}
      port: {{ $service.ports.http.portNumber }}
      scheme: http
    {{- if $middlewares }}
    middlewares:
    {{- range $middleware := $middlewares }}
    - name: {{ $middleware.name | quote }}
      namespace: {{ $namespace }}
    {{- end }}
    {{- end }}
  {{- with $ingressRoute.certResolver }}
  tls:
    certResolver: {{ . }}
  {{- end }}
{{- end }}
