{{ include "radicale.validateValues" . }}
{{- $service := .Values.service -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "radicale.serviceName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "radicale.labels" . | nindent 4 }}
spec:
  selector: {{- include "radicale.selectorLabels" . | nindent 4 }}
  type: {{ $service.type }}
  ports:
  {{- range $portObjName, $port := $service.ports }}
  - protocol: {{ $port.protocol }}
    port: {{ $port.portNumber }}
    targetPort: {{ $port.targetPort }}
    name: {{ $portObjName }}
  {{- end }}
