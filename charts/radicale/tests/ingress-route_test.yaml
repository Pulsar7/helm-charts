#------------------------------------------------------------------------------
#
# IngressRoute-Unittests Test-Suite for radicale
#
# > https://github.com/helm-unittest/helm-unittest/blob/main/DOCUMENT.md
#
#------------------------------------------------------------------------------
#
suite: Test IngressRoute
#
templates:
  - templates/ingress-route.yaml
#
tests:
  - it: should not render IngressRoute
    set:
      ingressRoute.enabled: false
    asserts:
      - notExists:
          path: spec

  - it: should render enabled ingressroute with test values
    set:
      ingressRoute:
        enabled: true
        entryPoints: ["websecure", "test"]
        certResolver: "test-resolver"
        routeMatch: Host(`test-host`)
    asserts:
      - isKind:
          of: IngressRoute
      - equal:
          path: spec.entryPoints
          value: ["websecure", "test"]
      - equal:
          path: spec.routes[?(@.kind=="Rule")].match
          value: Host(`test-host`)
      - equal:
          path: spec.tls.certResolver
          value: "test-resolver"
  
  - it: should render enabled IngressRoute with referenced middlewares
    set:
      ingressRoute:
        enabled: true
        entryPoints: ["websecure", "test"]
        certResolver: "test-resolver"
        routeMatch: Host(`test-host`)
      middlewares:
        testRadicaleMiddleware:
          name: test-radicale-middleware
          spec:
            average: 999
            period: 777s
            burst: 333
    asserts:
      - isKind:
          of: IngressRoute
      - equal:
          path: spec.routes[0].middlewares
          value:
            - name: test-radicale-middleware
              namespace: NAMESPACE
      - equal:
          path: spec.tls.certResolver
          value: "test-resolver"