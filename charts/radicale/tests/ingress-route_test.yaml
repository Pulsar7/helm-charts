#------------------------------------------------------------------------------
#
# IngressRoute-Unittests Test-Suite for radicale
#
# > https://github.com/helm-unittest/helm-unittest/blob/main/DOCUMENT.md
#
#------------------------------------------------------------------------------
#
suite: Test IngressRoute
templates:
  - templates/ingress-route.yaml
tests:
  - it: should not render HTTP-IngressRoute
    set:
      httpIngressRoute.enabled: false
    asserts:
      - notExists:
          path: spec

  - it: should render enabled HTTP-IngressRoute with adjusted values
    set:
      httpService:
        serviceName: "hello-world"
        httpPort:
          portNumber: 1337
      httpIngressRoute:
        enabled: true
        entryPoints: ["websecure", "test"]
        certResolver: "test-resolver"
        routeMatch: Host(`test-host`)
        refMiddlewares: ["test-radicale-middleware"]
      middlewares:
        testRadicaleMiddleware:
          name: test-radicale-middleware
          spec:
            average: 999
            period: 777s
            burst: 333
    asserts:
      - isKind:
          of: IngressRoute
      - equal:
          path: spec.entryPoints
          value: ["websecure", "test"]
      - equal:
          path: spec.routes[?(@.kind=="Rule")].match
          value: Host(`test-host`)
      - equal:
          path: spec.tls.certResolver
          value: "test-resolver"
      - equal:
          path: spec.routes[0].middlewares
          value:
            - name: test-radicale-middleware
              namespace: NAMESPACE
      - equal:
          path: spec.routes[0].services[0]
          value:
            name: "hello-world"
            port: 1337
            scheme: http
  
  - it: should render enabled HTTP-IngressRoute without referenced middlewares
    set:
      httpIngressRoute:
        enabled: true
        entryPoints: ["websecure", "test"]
        certResolver: "test-resolver"
        routeMatch: Host(`test-host`)
    asserts:
      - isKind:
          of: IngressRoute
      - notExists:
          path: spec.routes[0].middlewares
      - equal:
          path: spec.tls.certResolver
          value: "test-resolver"
  
  - it: should render enabled extra-IngressRoute
    set:
      httpIngressRoute.enabled: false
      extraIngressRoutes:
        additionalTestIngressRoute:
          name: "additional-test-ingressroute"
          entryPoints: ["hello", "world"]
          certResolver: "test-resolver"
          routeMatch: Host(`test-host`)
          refServiceName: "existing-service-name"
          refServicePortNumber: 1338
    asserts:
      - isKind:
          of: IngressRoute
      - equal:
          path: spec.entryPoints
          value: ["hello", "world"]
      - equal:
          path: spec.routes[0].match
          value: Host(`test-host`)
      - equal:
          path: spec.routes[0].services[0]
          value:
            name: "existing-service-name"
            port: 1338
            scheme: http
      - equal:
          path: spec.tls.certResolver
          value: "test-resolver"

  - it: should render three IngressRoute-resources (httpIngressRoute and two extra IngressRoutes)
    set:
      httpIngressRoute:
        enabled: true
        entryPoints: ["helloworld"]
      extraIngressRoutes:
        additionalTestIngressRoute:
          name: "additional-test-ingressroute"
          entryPoints: ["hello", "world"]
          certResolver: "test-resolver"
          routeMatch: Host(`test-host`)
          refServiceName: "existing-service-name"
          refServicePortNumber: 1338
        secondAdditionalTestIngressRoute:
          name: "additional-test-ingressroute"
          entryPoints: ["hello", "world"]
          certResolver: "test-resolver"
          routeMatch: Host(`test-host`)
          refServiceName: "existing-service-name"
          refServicePortNumber: 1338
    asserts:
      - hasDocuments:
          count: 3
  
  