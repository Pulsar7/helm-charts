#------------------------------------------------------------------------------
#
# Deployment-Unittests Test-Suite for radicale
#
# > https://github.com/helm-unittest/helm-unittest/blob/main/DOCUMENT.md
#
#------------------------------------------------------------------------------
suite: Test Deployment
templates:
  - templates/deployment.yaml
  #
  # following are required to calculate their checksum
  - templates/service.yaml
  - templates/secret.yaml
  - templates/ingress-route.yaml
  - templates/middlewares.yaml
  - templates/configmap.yaml
tests:
  - it: should render deployment without reference to a PVC for the data-volume
    template: templates/deployment.yaml
    set:
      persistence.enabled: false
    asserts:
      - isKind:
          of: Deployment
      - notExists:
          path: spec.template.spec.volumes[?(@.name=="data")].persistentVolumeClaim
  
  - it: should render deployment with reference to a PVC for the data-volume
    template: templates/deployment.yaml
    set:
      persistence:
        enabled: true
        claimName: "test-radicale-data"
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.volumes[?(@.name=="data")].persistentVolumeClaim.claimName
          value: "test-radicale-data"
