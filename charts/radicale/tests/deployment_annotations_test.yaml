#------------------------------------------------------------------------------
#
# Deployment/Annotations-Unittests Test-Suite for radicale
#
# > https://github.com/helm-unittest/helm-unittest/blob/main/DOCUMENT.md
#
#------------------------------------------------------------------------------
suite: Test Deployment/Annotations
#
# The template files scope to test in this suite
# Only the selected files will be rendered
templates:
  - templates/deployment.yaml
  #
  # following are required to calculate their checksum
  - templates/service.yaml
  - templates/secret.yaml
  - templates/ingress-route.yaml
  - templates/middlewares.yaml
  - templates/configmap.yaml
#
tests:
  - it: should render deployment with `checksum/ingress-route`
    template: templates/deployment.yaml
    set:
      ingressRoute:
        enabled: true
        entryPoints: ["invalid-test-entrypoint"]
    asserts:
      - isKind:
          of: Deployment
      - exists:
          path: spec.template.metadata.annotations["checksum/ingress-route"]

  - it: should render deployment without `checksum/ingress-route`
    template: templates/deployment.yaml
    set:
      ingressRoute.enabled: false
    asserts:
      - isKind:
          of: Deployment
      - notExists:
          path: spec.template.metadata.annotations["checksum/ingress-route"]