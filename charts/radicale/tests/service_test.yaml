#------------------------------------------------------------------------------
#
# Service-Unittests Test-Suite for radicale
#
# > https://github.com/helm-unittest/helm-unittest/blob/main/DOCUMENT.md
#
#------------------------------------------------------------------------------
#
suite: Test Service
#
templates:
  - templates/service.yaml
#
tests:
  - it: should render service with adjusted specs
    set:
      service:
        type: "InvalidServiceType"
        serviceName: "test-service"
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: "test-service"
      - equal:
          path: spec.type
          value: "InvalidServiceType"
      
  - it: should render service with different exposed port
    set:
      service.ports.http.portNumber: 1337
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 1337
