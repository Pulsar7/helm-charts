#------------------------------------------------------------------------------
#
# Secret-Unittests Test-Suite for radicale
#
# > https://github.com/helm-unittest/helm-unittest/blob/main/DOCUMENT.md
# 
#------------------------------------------------------------------------------
#
suite: Test Secret
templates:
  - templates/secret.yaml
tests:
  - it: should render Secret with enabled authentication and default credentials
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: stringData.users
          value: "test:$2y$05$HcQyLhN2cCClMVqulAZ4Xe42BX5WM5HTk3BgrgO/U8wfuOMT7t00a"
  
  - it: should not render Secret with enabled authentication and referenced existing Secret
    set:
      authentication:
        useExistingSecret: true
        secretName: "external-radicale-secret"
    asserts:
      - notExists:
          path: apiVersion