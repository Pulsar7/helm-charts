#------------------------------------------------------------------------------
#
# Middlewares-Unittests Test-Suite for radicale
#
# > https://github.com/helm-unittest/helm-unittest/blob/main/DOCUMENT.md
# 
#------------------------------------------------------------------------------
#
suite: Test Middlewares
#
templates:
  - templates/middlewares.yaml
#
tests:
  - it: should not render middlewares with disabled IngressRoute
    set:
      ingressRoute.enabled: false
    asserts:
      - notExists:
          path: spec

  - it: should render enabled middlewares with test values
    set:
      ingressRoute:
        enabled: true
        entryPoints: ["invalid-test-entrypoint"]
      middlewares:
        testRadicaleMiddleware:
          name: test-radicale-middleware
          spec:
            average: 999
            period: 777s
            burst: 333
    asserts:
      - isKind:
          of: Middleware
      - equal:
          path: metadata.name
          value: "test-radicale-middleware"
      - equal:
          path: spec.average
          value: 999
      - equal:
          path: spec.period
          value: 777s
      - equal:
          path: spec.burst
          value: 333