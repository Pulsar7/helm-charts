#------------------------------------------------------------------
#
# Values for the Custom radicale Helm-Chart
#
#------------------------------------------------------------------

# =================================================================
# Pod specifications
# =================================================================
#
# -- Number of Pods
# @section -- Pod specifications
replicaCount: 1
#
# -- The strategy used to replace old Pods by new ones
# https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy
# @section -- Pod specifications
strategy:
  type: Recreate
#
# -- Pod Security Context
# @section -- Pod specifications
podSecurityContext:
  runAsUser: 2999
  runAsGroup: 2999
  fsGroup: 2999
  runAsNonRoot: true
#
# -- Additional Pod-annotations
# @section -- Pod specifications
podAnnotations: {}
#
# -- Additional Pod-Labels
# @section -- Pod specifications
podLabels: {}
#
# -- Additional Volumes
# @section -- Pod specifications
extraVolumes: []
#
# -- Kubernetes only schedules the Pod onto nodes that have each of the labels you specify
# @section -- Pod specifications
nodeSelector: {}
#
# -- Affinity expand the types of constraints you can define
# @section -- Pod specifications
affinity: {}
#
# -- Tolerations allow the scheduler to schedule pods with matching taints
# @section -- Pod specifications
tolerations: []


# =================================================================
# Container specifications
# =================================================================
#
# -- List of sidecar-Containers
# @section -- Extra-Containers specifications
extraContainers: []
#
radicaleContainer:
  #
  # Image specifications of the radicale-Container
  image:
    #
    # -- Container-Image-Repository
    # @section -- radicale-Container specifications
    repository: "tomsquest/docker-radicale"
    #
    # -- Container-Image-Tag (overrides `.Chart.AppVersion`)
    # @section -- radicale-Container specifications
    tag: ""
    #
    # -- Container-Image pull-policy
    # @section -- radicale-Container specifications
    pullPolicy: IfNotPresent
  #
  # -- Container Security Context
  # @section -- radicale-Container specifications
  securityContext:
    runAsUser: 2999
    runAsGroup: 2999
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    privileged: false
  #
  # -- Container Resources
  # @section -- radicale-Container specifications
  resources: {}
  # e.g.:
  #  requests:
  #    memory: 200Mi
  #    cpu: 100m
  #  limits:
  #    memory: 500Mi
  #    cpu: 500m
  #
  # -- HTTP-Port specifications
  # @section -- radicale-Container/ports/httpPort specifications
  httpPort:
    #
    # -- Name of the HTTP-Container port
    # @section -- radicale-Container/ports/httpPort specifications
    name: "http"
    #
    # -- Exposed port-number of the HTTP-Container port
    # @section -- radicale-Container/ports/httpPort specifications
    containerPort: 5000
  #
  # -- Expose additional Container-ports
  # @section -- radicale-Container specifications
  extraPorts: {}
  # e.g.:
  #  additionalPort:
  #    name: "additional-port"
  #    containerPort: 1337
  #
  # -- Additional Volume-Mounts for Container
  # @section -- radicale-Container specifications
  extraVolumeMounts: []
  #
  # -- Additional environment variables for the Container
  # @section -- radicale-Container specifications
  extraEnvs: []
  #
  # -- Startup-Probe
  # @section -- radicale-Container specifications
  startupProbe: {}
  #
  # -- Readiness-Probe
  # @section -- radicale-Container specifications
  readinessProbe: {}
  #
  # -- Liveness-Probe
  # @section -- radicale-Container specifications
  livenessProbe: {}


# =================================================================
# Service specifications
# =================================================================
#
# -- Specification for the exposed HTTP-Service
# @section -- HTTP-Service specifications
httpService:
  #
  # -- Name of the HTTP-Service
  # @section -- HTTP-Service specifications
  serviceName: "http"
  #
  # -- Type of the NTFY-Service resource
  # @section -- HTTP-Service specifications
  type: ClusterIP
  #
  # -- Additional specifications for the Service
  # @section -- HTTP-Service specifications
  additionalSpecs: {}
  #
  # HTTP-port
  httpPort:
    #
    # -- Name of Service-port
    # @section -- HTTP-Service specifications
    name: "http"
    #
    # -- Exposed Service-port
    # @section -- HTTP-Service specifications
    portNumber: 5000
    #
    # -- Protocol
    # @section -- HTTP-Service specifications
    protocol: TCP
#
# -- Additional Services
# @section -- Additional-Service specifications
extraServices: {}
# e.g.:
#  additionalService:
#    name: "name-of-additional-service"
#    type: "ClusterIP"
#    additionalSpecs: {}
#    ports:
#      testPort:
#        name: "service-test-port-name"
#        portNumber: 1337
#        targetPort: 1338
#        protocol: TCP


# =================================================================
# Ingress specifications
# =================================================================
#
httpIngressRoute:
  #
  # -- Whether to enable the HTTP-IngressRoute for radicale
  # @section -- Ingress/HTTP-IngressRoute specifications
  enabled: false
  #
  # -- Name of the HTTP-IngressRoute for radicale
  # @section -- Ingress/HTTP-IngressRoute specifications
  name: "http"
  #
  # -- Listening for Incoming Connections/Requests
  # https://doc.traefik.io/traefik/reference/install-configuration/entrypoints/
  # @section -- Ingress/HTTP-IngressRoute specifications
  entryPoints: []
  #
  # -- Name of the Certificate Resolver to use to generate automatic TLS certificates.
  # https://doc.traefik.io/traefik/reference/install-configuration/tls/certificate-resolvers/overview/
  # @section -- Ingress/HTTP-IngressRoute specifications
  certResolver: ""
  #
  # -- Route-Match of the IngressRoute
  # @section -- Ingress/HTTP-IngressRoute specifications
  routeMatch: Host(``)
  #
  # -- Reference Middleware
  # @section -- Ingress/HTTP-IngressRoute specifications
  refMiddlewares: []
#
# -- Define additional IngressRoute-resources
# @section -- Ingress/IngressRoute specifications
extraIngressRoutes: {}
#  testIngressRoute:
#    name: "test-ingress-route-name"
#    entryPoints: ["web"]
#    certResolver: "my-certresolver"
#    routeMatch: Host(`test.localhost`)
#    refServiceName: "referenced-service-name"
#    refServicePortNumber: 1337
#    refMiddlewares: []
#
# -- Traefik Middlewares that should be used by the IngressRoute-rule.
# @section -- Ingress/Middleware specifications
middlewares: {}
#
# e.g.:
#  exampleMiddleware:
#    name: "example-middleware"
#    spec:
#      headers:
#        forceSTSHeader: true
#        stsSeconds: 15552000


# =================================================================
# Authentication specifications
# =================================================================
#
authentication:
  #
  # -- Whether to use an existing Secret instead
  # @section -- radicale-Authentication specifications
  useExistingSecret: false
  #
  # -- Name of the Secret (overrides the default)
  # @section -- radicale-Authentication specifications
  secretName: ""
  #
  # -- Secret-Key Name for Users
  # @section -- radicale-Authentication specifications
  secretKey: "users"


# =================================================================
# Persistence specifications
# =================================================================
#
persistence:
  #
  # -- Whether to enable persistence for collections-data (enables PVC).
  # Otherwise local ephemeral storage is being used (emptyDir).
  # @section -- radicale-Persistence specifications
  enabled: true
  #
  # -- SizeLimit for emptyDir (used when persistence is disabled)
  # @section -- radicale-Persistence specifications
  emptyDirSizeLimit: "1Gi"
  #
  # -- Whether to create a new PVC instead of referencing an existing one.
  # @section -- radicale-Persistence specifications
  createPVC: true
  #
  # -- StorageClassName of the PVC
  # @section -- radicale-Persistence specifications
  storageClassName: ""
  #
  # -- Name of existing PersistentVolumeClaim.
  # Gets ignored when `persistence.createPVC: true`
  # @section -- radicale-Persistence specifications
  claimName: ""
  #
  # -- Access-Modes of the PVC
  # @section -- radicale-Persistence specifications
  accessModes: ["ReadWriteOnce"]
  #
  # -- storage-request for the PVC
  # @section -- radicale-Persistence specifications
  storageRequest: "5Gi"


# =================================================================
# Config specifications
# =================================================================
#
configFile:
  #
  # -- Whether to use an existing ConfigMap instead
  # @section -- Config specifications
  useExistingConfigMap: false
  #
  # -- Name of the existing ConfigMap
  # @section -- Config specifications
  configMapName: ""
  #
  # -- Key to the ConfigMap-item
  # @section -- Config specifications
  configMapKey: "config.conf"
  #
  # Configure existing 'config'-file (will be ignored, if `useExistingConfigMap: true`)
  dynamicValues:
    #
    # -- Additional configuration for the `[server]`-Section.
    # `hosts` is configured automatically, based on the configured exposed containerPort for `http`.
    # @section -- Config specifications
    extraServerSection: ""
    #
    # -- `[auth]`-Section
    # @section -- Config specifications
    authSection: |-
      type = htpasswd
      htpasswd_filename = /config/users
      htpasswd_encryption = bcrypt
    #
    # -- `[rights]`-Section
    # @section -- Config specifications
    rightsSection: |-
      type = owner_only
    #
    # -- `[storage]`-Section
    # @section -- Config specifications
    storageSection: |-
      type = multifilesystem
      filesystem_folder = /data/collections
    #
    # -- `[web]`-Section
    # @section -- Config specifications
    webSection: |-
      type = internal
    #
    # -- `[logging]`-Section
    # @section -- Config specifications
    loggingSection: |-
      level = info