#------------------------------------------------------------------
#
# Values for the Custom radicale Helm-Chart
#
#------------------------------------------------------------------

# =================================================================
# Pod specifications
# =================================================================
#
# -- Number of Pods
# @section -- Pod specifications
replicaCount: 1
#
# -- The strategy used to replace old Pods by new ones
# https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy
# @section -- Pod specifications
strategy:
  type: Recreate
#
# -- Pod Security Context
# @section -- Pod specifications
podSecurityContext:
  runAsUser: 2999
  runAsGroup: 2999
  fsGroup: 2999
  runAsNonRoot: true
#
# -- Additional Pod-annotations
# @section -- Pod specifications
podAnnotations: {}
#
# -- Additional Pod-Labels
# @section -- Pod specifications
podLabels: {}
#
# -- Additional Volumes
# @section -- Pod specifications
extraVolumes: []
#
# -- Kubernetes only schedules the Pod onto nodes that have each of the labels you specify
# @section -- Pod specifications
nodeSelector: {}
#
# -- Affinity expand the types of constraints you can define
# @section -- Pod specifications
affinity: {}
#
# -- Tolerations allow the scheduler to schedule pods with matching taints
# @section -- Pod specifications
tolerations: []


# =================================================================
# Container specifications
# =================================================================
#
# -- List of sidecar-Containers
# @section -- Extra-Containers specifications
extraContainers: []
#
radicaleContainer:
  #
  # Image specifications of the radicale-Container
  image:
    #
    # -- Container-Image-Repository
    # @section -- radicale-Container specifications
    repository: "tomsquest/docker-radicale"
    #
    # -- Container-Image-Tag (overrides `.Chart.AppVersion`)
    # @section -- radicale-Container specifications
    tag: ""
    #
    # -- Container-Image pull-policy
    # @section -- radicale-Container specifications
    pullPolicy: IfNotPresent
  #
  # -- Container Security Context
  # @section -- radicale-Container specifications
  securityContext:
    runAsUser: 2999
    runAsGroup: 2999
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    privileged: false
  #
  # -- Container Resources
  # @section -- radicale-Container specifications
  resources: {}
  #resources:
  #  requests:
  #    memory: 200Mi
  #    cpu: 100m
  #  limits:
  #    memory: 500Mi
  #    cpu: 500m
  #
  # Container-ports
  ports:
    http:
      #
      # -- Name of Container-port
      # @section -- radicale-Container/ports/http specifications
      name: "http"
      #
      # -- Exposed Container-port
      # @section -- radicale-Container/ports/http specifications
      containerPort: 5000
  #
  # -- Additional Volume-Mounts for Container
  # @section -- radicale-Container specifications
  extraVolumeMounts: []
  #
  # -- Environment variables for the Container
  # @section -- radicale-Container specifications
  env:
    - name: "TAKE_FILE_OWNERSHIP"
      value: "false"
  #
  # -- Startup-Probe
  # @section -- radicale-Container specifications
  startupProbe: {}
  #
  # -- Readiness-Probe
  # @section -- radicale-Container specifications
  readinessProbe: {}
  #
  # -- Liveness-Probe
  # @section -- radicale-Container specifications
  livenessProbe: {}


# =================================================================
# Service specifications
# =================================================================
service:
  #
  # -- Name of the NTFY-Service resource (overrides the default)
  # @section -- radicale-Service specifications
  serviceName: ""
  #
  # -- Type of the NTFY-Service resource
  # @section -- radicale-Service specifications
  type: ClusterIP
  # @ignored
  ports:
    #
    # HTTP-port
    http:
      #
      # -- Name of Service-port
      # @section -- radicale-Service specifications
      name: "http"
      #
      # -- Exposed Service-port
      # @section -- radicale-Service specifications
      portNumber: 5232
      #
      # -- Exposed Container-port name.
      # Reference here defined container-port name.
      # by default: `.Values.radicaleContainer.ports.http.name`
      # @section -- radicale-Service specifications
      targetPort: "http"
      #
      # -- Protocol
      # @section -- radicale-Service specifications
      protocol: TCP


# =================================================================
# Authentication specifications
# =================================================================
#
authentication:
  #
  # -- Whether to use an existing Secret instead
  # @section -- radicale-Authentication specifications
  useExistingSecret: false
  #
  # -- Name of the Secret (overrides the default)
  # @section -- radicale-Authentication specifications
  secretName: ""
  #
  # -- Secret-Key Name for Users
  # @section -- radicale-Authentication specifications
  secretKey: "users"


# =================================================================
# Persistence specifications
# =================================================================
#
persistence:
  #
  # -- Whether to enable persistence for collections-data (enables PVC).
  # Otherwise local ephemeral storage is being used (emptyDir).
  # @section -- radicale-Persistence specifications
  enabled: true
  #
  # -- SizeLimit for emptyDir (used when persistence is disabled)
  # @section -- radicale-Persistence specifications
  emptyDirSizeLimit: "1Gi"
  #
  # -- Whether to create a new PVC
  # @section -- radicale-Persistence specifications
  createPVC: true
  #
  # -- StorageClassName of the PVC
  # @section -- radicale-Persistence specifications
  storageClassName: ""
  #
  # -- Name of the PVC
  # @section -- radicale-Persistence specifications
  claimName: ""
  #
  # -- Access-Modes of the PVC
  # @section -- radicale-Persistence specifications
  accessModes: ["ReadWriteOnce"]
  #
  # -- storage-request for the PVC
  # @section -- radicale-Persistence specifications
  storageRequest: "5Gi"


# =================================================================
# Config specifications
# =================================================================
#
configFile:
  #
  # -- Whether to use an existing ConfigMap instead
  # @section -- Config specifications
  useExistingConfigMap: false
  #
  # -- Name of the existing ConfigMap
  # @section -- Config specifications
  configMapName: ""
  #
  # -- Key to the ConfigMap-item
  # @section -- Config specifications
  configMapKey: "config.conf"
  #
  # Configure existing 'config'-file (will be ignored, if `useExistingConfigMap: true`)
  dynamicValues:
    #
    # -- `[server]`-Section
    # @section -- Config specifications
    serverSection: |-
      hosts: 0.0.0.0:5232
    #
    # -- `[auth]`-Section
    # @section -- Config specifications
    authSection: |-
      type = htpasswd
      htpasswd_filename = /config/users
      htpasswd_encryption = bcrypt
    #
    # -- `[rights]`-Section
    # @section -- Config specifications
    rightsSection: |-
      type = owner_only
    #
    # -- `[storage]`-Section
    # @section -- Config specifications
    storageSection: |-
      type = multifilesystem
      filesystem_folder = /data/collections
    #
    # -- `[web]`-Section
    # @section -- Config specifications
    webSection: |-
      type = internal
    #
    # -- `[logging]`-Section
    # @section -- Config specifications
    loggingSection: |-
      level = info


# =================================================================
# Ingress specifications
# =================================================================
#
ingressRoute:
  #
  # -- Whether to enable the IngressRoute for radicale
  # @section -- Ingress/IngressRoute specifications
  enabled: false
  #
  # -- Listening for Incoming Connections/Requests
  # https://doc.traefik.io/traefik/reference/install-configuration/entrypoints/
  # @section -- Ingress/IngressRoute specifications
  entryPoints: []
  #
  # -- Name of the Certificate Resolver to use to generate automatic TLS certificates.
  # https://doc.traefik.io/traefik/reference/install-configuration/tls/certificate-resolvers/overview/
  # @section -- Ingress/IngressRoute specifications
  certResolver: ""
  #
  # -- Route-Match of the IngressRoute
  # @section -- Ingress/IngressRoute specifications
  routeMatch: Host(``)
#
# -- Traefik Middlewares that should be used by the IngressRoute-rule.
# Gets ignored when `ingressRoute.enabled: false`.
# @section -- Ingress/Middleware specifications
middlewares: {}
#
# e.g.:
#  exampleMiddleware:
#    name: "example-middleware"
#    spec:
#      headers:
#        forceSTSHeader: true
#        stsSeconds: 15552000
