{{ include "librefrontier.validateValues" . }}
{{- $librefrontierContainer := .Values.librefrontierContainer -}}
{{- $config := .Values.config -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "librefrontier.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "librefrontier.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy: {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels: {{- include "librefrontier.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/services: {{ include (print $.Template.BasePath "/services.yaml") . | sha256sum }}
        {{- if (include "librefrontier.createIngressRoute" .) }}
        checksum/ingress-routes: {{ include (print $.Template.BasePath "/ingress-routes.yaml") . | sha256sum }}
        {{- end }}
        {{- if (include "librefrontier.createMiddleware" .) }}
        checksum/middlewares: {{ include (print $.Template.BasePath "/middlewares.yaml") . | sha256sum }} 
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "librefrontier.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.initContainers }}
      initContainers: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        {{- with $librefrontierContainer.securityContext }}
        securityContext: {{- toYaml . | nindent 12 }}
        {{- end }}
        image: {{ include "librefrontier.containerImage" . }}
        {{- with $librefrontierContainer.image.pullPolicy }}
        imagePullPolicy: {{ . }}
        {{- end }}
        ports:
        {{- range $port := $librefrontierContainer.ports }}
        - name: {{ $port.name }}
          containerPort: {{ $port.containerPort }}
        {{- end }}
        env:
        - name: API_PORT
          value: {{ $librefrontierContainer.ports.httpAPI.containerPort | quote }}
        - name: ENABLE_GUI
          value: {{ $config.enableGUI | quote }}
        - name: GUI_PORT
          value: {{ $librefrontierContainer.ports.httpWebUI.containerPort | quote }}
        - name: GIN_MODE
          value: {{ $config.ginMode | quote }}
        - name: LF_API_BASE_URL
          value: {{ $config.lfAPIBaseURL | quote }}
        - name: LF_DB_CONN_STRING
          valueFrom:
            secretKeyRef:
              name: {{ $config.databaseConnectionString.secretName }}
              key: {{ $config.databaseConnectionString.secretKey }}
        - name: LOG_LEVEL
          value: {{ $config.logLevel | quote }}
        - name: RADIO_BROWSER_URL
          value: {{ $config.radioBrowserURL | quote }}
        - name: PROXY_ALL_STREAMS
          value: {{ $config.proxyAllStreams | quote }}
        - name: MAX_CONCURRENT_STREAMS
          value: {{ $config.maxConcurrentStreams | quote  }}
        {{- with $librefrontierContainer.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $librefrontierContainer.extraArgs }}
        args: {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $librefrontierContainer.resources }}
        resources: {{ toYaml . | nindent 12 }}
        {{- end }}
        {{- with $librefrontierContainer.startupProbe }}
        startupProbe: {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $librefrontierContainer.readinessProbe }}
        readinessProbe: {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $librefrontierContainer.livenessProbe }}
        livenessProbe: {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $librefrontierContainer.extraVolumeMounts }}
        volumeMounts: {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.extraContainers }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.extraVolumes }}
      volumes: {{- toYaml . | nindent 6 }}
      {{- end }}
