{{ include "librefrontier.validateValues" . }}
{{- $config := .Values.config }}
{{- $dbConnStringConfig := $config.databaseConnectionString -}}
{{- if (include "librefrontier.createSecret" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $dbConnStringConfig.secretName }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "librefrontier.labels" . | nindent 4 }}
stringData:
  {{ $dbConnStringConfig.secretKey }}: {{ $dbConnStringConfig.defaultConnectionString | quote }}
{{- end -}}
