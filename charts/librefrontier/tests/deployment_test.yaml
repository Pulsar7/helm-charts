#------------------------------------------------------------------------------
#
# Deployment-Unittests Test-Suite for librefrontier
#
# > https://github.com/helm-unittest/helm-unittest/blob/main/DOCUMENT.md
# 
#------------------------------------------------------------------------------
suite: Test Deployment
templates:
  - templates/deployment.yaml
  #
  # following are required to calculate their checksum
  - templates/secrets.yaml
  - templates/ingress-routes.yaml
  - templates/middlewares.yaml
  - templates/services.yaml
tests:
  - it: should render Deployment with adjusted librefrontier-Container image-URL
    template: templates/deployment.yaml
    set:
      librefrontierContainer.image:
        registry: "my-private.registry"
        repository: "my/private-librefrontier-repo"
        tag: "1337.1337.1337"
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].image
          value: "my-private.registry/my/private-librefrontier-repo:1337.1337.1337"