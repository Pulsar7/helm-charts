#------------------------------------------------------------------
#
# Default Helm-Values for the custom Librefrontier Helm chart
#
#------------------------------------------------------------------

# =================================================================
# Pod specifications
# =================================================================
#
# -- Number of Pods
# @section -- Pod specifications
replicaCount: 1
#
# -- The strategy used to replace old Pods by new ones
# https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy
# @section -- Pod specifications
strategy:
  type: RollingUpdate
#
# -- Pod Security Context
# @section -- Pod specifications
podSecurityContext:
  runAsUser: 100
  runAsGroup: 101
  fsGroup: 101
  runAsNonRoot: true
  fsGroupChangePolicy: "OnRootMismatch"
#
# -- Additional Pod-annotations
# @section -- Pod specifications
podAnnotations: {}
#
# -- Additional Pod-Labels
# @section -- Pod specifications
podLabels: {}
#
# -- Additional Volumes
# @section -- Pod specifications
extraVolumes: {}
#
# -- Kubernetes only schedules the Pod onto nodes that have each of the labels you specify
# @section -- Pod specifications
nodeSelector: {}
#
# -- Affinity expand the types of constraints you can define
# @section -- Pod specifications
affinity: {}
#
# -- Tolerations allow the scheduler to schedule pods with matching taints
# @section -- Pod specifications
tolerations: []


# =================================================================
# Container specifications
# =================================================================
#
# -- Init-Containers
# @section -- Init-Containers
initContainers: []
#
# -- Additional sidecar-Containers
# @section -- Extra Containers
extraContainers: []
#
librefrontierContainer:
  #
  # Image specifications of the Librefrontier-Container
  image:
    #
    # -- Container-Image-Repository
    # @section -- Librefrontier-Container specifications
    repository: ghcr.io/lukas-fichtner/librefrontier
    #
    # -- Container-Image-Tag (overrides `.Chart.AppVersion`)
    # @section -- Librefrontier-Container specifications
    tag: ""
    #
    # -- Container-Image pull-policy
    # @section -- Librefrontier-Container specifications
    pullPolicy: IfNotPresent
  #
  # -- Container Security Context
  # @section -- Librefrontier-Container specifications
  securityContext:
    runAsUser: 100
    runAsGroup: 101
    allowPrivilegeEscalation: false
    privileged: false
    capabilities:
      drop: ["ALL"]
  #
  # -- Container resource requests and limits
  # @section -- Librefrontier-Container specifications
  resources: {}
  #resources:
  #  requests:
  #    memory: 200Mi
  #    cpu: 100m
  #  limits:
  #    memory: 500Mi
  #    cpu: 500m
  #
  # -- Exposed Container-ports
  # @section -- Librefrontier-Container specifications
  ports:
    http:
      #
      # -- Name of exposed http Container-port
      # @section -- Librefrontier-Container/ports specifications
      name: "http-api"
      #
      # -- Port-number of exposed http Container-port
      # @section -- Librefrontier-Container/ports specifications
      containerPort: 80
  #
  # -- Additional Volume-Mounts for Container
  # @section -- Librefrontier-Container specifications
  extraVolumeMounts: {}
  #
  # -- Additional Environment-variables
  # @section -- Librefrontier-Container specifications
  extraEnv: {}
  #
  # -- Additional Arguments
  # @section -- Librefrontier-Container specifications
  extraArgs: {}
  #
  # --
  # @section -- Librefrontier-Container specifications
  startupProbe: {}
  #
  # --
  # @section -- Librefrontier-Container specifications
  readinessProbe: {}
  #
  # --
  # @section -- Librefrontier-Container specifications
  livenessProbe: {}
  

# =================================================================
# Librefrontier Configuration
# =================================================================
config:
  #
  # -- GIN_MODE
  # @section -- Config specifications
  ginMode: "release"
  #
  # -- LF_API_BASE_URL
  # @section -- Config specifications
  lfAPIBaseURL: "http://teufel.wifiradiofrontier.com"
  #
  databaseConnectionString:
    #
    # -- Name of the Secret, storing the database-connection-string
    # @section -- Config specifications
    secretName: librefrontier-secret
    #
    # -- Secret-key, storing the database-connection-string
    # @section -- Config specifications
    secretKey: "database-connection-string"
    #
    # -- Whether to use an existing Secret or a Secret
    # gets created.
    # @section -- Config specifications
    existingSecret: false
    #
    # -- When not using an existing-Secret, enter the database-connection-string.
    # @section -- Config specifications
    stringData: ""


# =================================================================
# IngressRoutes specifications
# =================================================================
#
httpAPIIngressRoute:
  #
  # -- Whether to enable the HTTP-API-IngressRoute
  # @section -- HTTP-API-IngressRoute specifications
  enabled: false
  #
  # -- Entrypoints for HTTP-API-Service
  # @section -- HTTP-API-IngressRoute specifications
  entryPoints: ["web"]
  #
  # -- Match for HTTP-API-Route
  # @section -- HTTP-API-IngressRoute specifications
  routeMatch: "PathPrefix(`/`)"
#
webUIIngressRoute:
  #
  # -- Whether to enable the Web-UI-IngressRoute.
  # requires `services.webUI.enabled: true` otherwise this gets ignored!
  # @section -- Web-UI IngressRoute specifications
  enabled: false
  #
  # -- Entrypoints for Web-UI-Service
  # @section -- Web-UI IngressRoute specifications
  entryPoints: []
  #
  # -- Name of the Certificate Resolver to use to generate automatic TLS certificates.
  # https://doc.traefik.io/traefik/reference/install-configuration/tls/certificate-resolvers/overview/
  # @section -- Web-UI IngressRoute specifications
  certResolver: ""
  #
  # -- Match for Web-UI-Route
  # @section -- Web-UI IngressRoute specifications
  routeMatch: "Host(``)"
