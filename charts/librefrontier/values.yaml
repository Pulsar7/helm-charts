#------------------------------------------------------------------
#
# Default Helm-Values for the custom Librefrontier Helm chart
#
#------------------------------------------------------------------

# =================================================================
# Pod specifications
# =================================================================
#
# -- Number of Pods
# @section -- Pod specifications
replicaCount: 1
#
# -- The strategy used to replace old Pods by new ones
# https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy
# @section -- Pod specifications
strategy:
  type: RollingUpdate
#
# -- Pod Security Context
# @section -- Pod specifications
podSecurityContext:
  runAsUser: 100
  runAsGroup: 101
  fsGroup: 101
  runAsNonRoot: true
  fsGroupChangePolicy: "OnRootMismatch"
#
# -- Additional Pod-annotations
# @section -- Pod specifications
podAnnotations: {}
#
# -- Additional Pod-Labels
# @section -- Pod specifications
podLabels: {}
#
# -- Additional Volumes
# @section -- Pod specifications
extraVolumes: {}
#
# -- Kubernetes only schedules the Pod onto nodes that have each of the labels you specify
# @section -- Pod specifications
nodeSelector: {}
#
# -- Affinity expand the types of constraints you can define
# @section -- Pod specifications
affinity: {}
#
# -- Tolerations allow the scheduler to schedule pods with matching taints
# @section -- Pod specifications
tolerations: []


# =================================================================
# Container specifications
# =================================================================
#
# -- Init-Containers
# @section -- Init-Containers
initContainers: []
#
# -- Additional sidecar-Containers
# @section -- Extra Containers
extraContainers: []
#
librefrontierContainer:
  #
  # Image specifications of the Librefrontier-Container
  image:
    #
    # -- Container-Image registry
    # @section -- Librefrontier-Container specifications
    registry: ghcr.io
    #
    # -- Container-Image repository
    # @section -- Librefrontier-Container specifications
    repository: lukas-fichtner/librefrontier
    #
    # -- Container-Image-Tag (overrides `.Chart.AppVersion`)
    # @section -- Librefrontier-Container specifications
    tag: ""
    #
    # -- Container-Image pull-policy
    # @section -- Librefrontier-Container specifications
    pullPolicy: IfNotPresent
  #
  # -- Container Security Context
  # @section -- Librefrontier-Container specifications
  securityContext:
    runAsUser: 100
    runAsGroup: 101
    allowPrivilegeEscalation: false
    privileged: false
    capabilities:
      drop: ["ALL"]
  #
  # -- Container resource requests and limits
  # @section -- Librefrontier-Container specifications
  resources: {}
  #resources:
  #  requests:
  #    memory: 200Mi
  #    cpu: 100m
  #  limits:
  #    memory: 500Mi
  #    cpu: 500m
  #
  # -- Exposed Container-ports
  # @section -- Librefrontier-Container specifications
  ports:
    httpAPI:
      #
      # -- Name of exposed http Container-port
      # @section -- Librefrontier-Container/ports specifications
      name: "http-api"
      #
      # -- Port-number of exposed http Container-port
      # @section -- Librefrontier-Container/ports specifications
      containerPort: 80
    #
    httpWebUI:
      #
      # -- Name of exposed http Container-port
      # @section -- Librefrontier-Container/ports specifications
      name: "http-web-ui"
      #
      # -- Port-number of exposed http Container-port
      # @section -- Librefrontier-Container/ports specifications
      containerPort: 8080
  #
  # -- Additional Volume-Mounts for the librefrontier-'main'-Container
  # @section -- Librefrontier-Container specifications
  extraVolumeMounts: []
  #
  # -- Additional Environment-variables for the librefrontier-'main'-Container
  # @section -- Librefrontier-Container specifications
  extraEnv: []
  #
  # -- Additional Arguments for the librefrontier-'main'-Container
  # @section -- Librefrontier-Container specifications
  extraArgs: []
  #
  # --
  # @section -- Librefrontier-Container specifications
  startupProbe: {}
  #
  # --
  # @section -- Librefrontier-Container specifications
  readinessProbe: {}
  #
  # --
  # @section -- Librefrontier-Container specifications
  livenessProbe: {}


# =================================================================
# Services specifications
# =================================================================
services:
  httpAPI:
    #
    # -- Service-Name for the http-API Service
    # @section -- Services specifications
    serviceName: "http-api"
    #
    # -- Service-Type
    # @section -- Services specifications
    type: ClusterIP
    #
    ports:
      httpAPI:
        #
        # -- Name of the Service-port
        # @section -- Services specifications
        servicePortName: http-api
        #
        # -- Exposed Service-port
        # @section -- Services specifications
        portNumber: 80
        #
        # -- Reference exposed Container-port by its name
        # @section -- Services specifications
        targetPort: http-api
        #
        # -- Protocol
        # @section -- Services specifications
        protocol: TCP
  #
  httpWebUI:
    #
    # -- Service-Name for the http-Web-UI Service
    # @section -- Services specifications
    serviceName: "http-web-ui"
    #
    # -- Service-Type
    # @section -- Services specifications
    type: ClusterIP
    #
    ports:
      httpWebUI:
        #
        # -- Name of the Service-port
        # @section -- Services specifications
        servicePortName: http-web-ui
        #
        # -- Exposed Service-port
        # @section -- Services specifications
        portNumber: 8080
        #
        # -- Reference exposed Container-port by its name
        # @section -- Services specifications
        targetPort: http-web-ui
        #
        # -- Protocol
        # @section -- Services specifications
        protocol: TCP


# =================================================================
# IngressRoutes and Middlewares specifications
# =================================================================
#
# -- Map of IngressRoutes
# @section -- IngressRoute/Middlewares specifications
ingressRoutes:
  httpAPI:
    #
    # -- Whether to create the httpAPI-IngressRoute
    # @section -- IngressRoute/httpAPI specifications
    enabled: false
    #
    # -- Name of IngressRoute resource
    # @section -- IngressRoute/httpAPI specifications
    name: "http-api"
    #
    # -- Name of referenced Service
    # @section -- IngressRoute/httpAPI specifications
    refServiceName: "http-api"
    #
    # -- Name of referenced Service-Port
    # @section -- IngressRoute/httpAPI specifications
    refServicePortName: "http-api"
    #
    # -- List of entryPoints
    # @section -- IngressRoute/httpAPI specifications
    entryPoints: []
    #
    # -- Route-Match
    # @section -- IngressRoute/httpAPI specifications
    routeMatch: ""
    #
    # -- Name of the TLS-cert-resolver
    # @section -- IngressRoute/httpAPI specifications
    certResolver: ""
    #
    # -- List with names of Middlewares
    # @section -- IngressRoute/httpAPI specifications
    refMiddlewares: []
#
# -- Map of middlewares added to the IngressRoute
# @section -- IngressRoute/Middlewares specifications
middlewares: {}
#
# e.g.:
#  exampleMiddleware:
#    name: "example-middleware"
#    spec:
#      headers:
#        forceSTSHeader: true
#        stsSeconds: 15552000


# =================================================================
# Librefrontier Configuration
# =================================================================
config:
  #
  # -- GIN_MODE
  # @section -- Config specifications
  ginMode: "release"
  #
  # -- ENABLE_GUI
  # @section -- Config specifications
  enableGUI: false
  #
  # -- LF_API_BASE_URL
  # @section -- Config specifications
  lfAPIBaseURL: "http://teufel.wifiradiofrontier.com"
  #
  databaseConnectionString:
    #
    # -- Name of the Secret, storing the database-connection-string
    # @section -- Config specifications
    secretName: librefrontier-secret
    #
    # -- Secret-key, storing the database-connection-string
    # @section -- Config specifications
    secretKey: "database-connection-string"
    #
    # -- Whether to use an existing Secret or a Secret
    # gets created.
    # @section -- Config specifications
    existingSecret: false
    #
    # -- When not using an existing-Secret, enter the database-connection-string.
    # @section -- Config specifications
    defaultConnectionString: ""
  #
  # -- LOG_LEVEL
  # @section -- Config specifications
  logLevel: "info"
  #
  # -- RADIO_BROWSER_URL
  # @section -- Config specifications
  radioBrowserURL: "de1.api.radio-browser.info"
  #
  # -- PROXY_ALL_STREAMS
  # @section -- Config specifications
  proxyAllStreams: true
  #
  # -- MAX_CONCURRENT_STREAMS
  # @section -- Config specifications
  maxConcurrentStreams: 10