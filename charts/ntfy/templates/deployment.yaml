{{ include "ntfy.validateValues" . }}
{{- $ntfyContainer := .Values.ntfyContainer -}}
{{- $ntfyContainerService := $ntfyContainer.service -}}
{{- $ntfyContainerStartupProbe := $ntfyContainer.startupProbe -}}
{{- $ntfyContainerReadinessProbe := $ntfyContainer.readinessProbe -}}
{{- $ntfyContainerLivenessProbe := $ntfyContainer.livenessProbe -}}
{{- $authentication := .Values.authentication -}}
{{- $authTokens := $authentication.authTokens -}}
{{- $authUsers := $authentication.authUsers -}}
{{- $authAccess := $authentication.authAccess -}}
{{- $authSecretNames := (include "ntfy.secretNames" .) | fromJsonArray -}}
{{- $authSecretKeys := list $authTokens.secretKey $authUsers.secretKey $authAccess.secretKey -}}
{{- $envList := list "NTFY_AUTH_TOKENS"  "NTFY_AUTH_USERS" "NTFY_AUTH_ACCESS" -}}
{{- $serverConfig := .Values.serverConfig -}}
{{- $persistence := .Values.persistence -}}
{{- $ingressRoute := .Values.ingressRoute -}}
{{- $middlewares := .Values.middlewares -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ntfy.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "ntfy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy: {{ .Values.strategy | toYaml | nindent 4 }}
  selector:
    matchLabels: {{- include "ntfy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if (include "ntfy.createConfigMap" .) }}
        checksum/configmap: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- if (include "ntfy.createSecret" .) }}
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
        {{- end }}
        {{- if (include "ntfy.createPersistentVolumeClaim" .) }}
        checksum/pvc: {{ include (print $.Template.BasePath "/pvc.yaml") . | sha256sum }}
        {{- end }}
        {{- if $ingressRoute.enabled }}
        checksum/ingressroute: {{ include (print $.Template.BasePath "/ingressroute.yaml") . | sha256sum }}
        {{- if $middlewares }}
        checksum/middlewares: {{ include (print $.Template.BasePath "/middlewares.yaml") . | sha256sum }}
        {{- end }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "ntfy.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        command: ["ntfy"]
        args:
        - "serve"
        - "--config=/etc/ntfy-config/server.yaml"
        {{- if $ntfyContainer.extraArgs }}
        {{- $ntfyContainer.extraArgs | toYaml | nindent 8 }}
        {{- end }}
        {{- if $ntfyContainer.securityContext }}
        securityContext: {{- $ntfyContainer.securityContext | toYaml | nindent 10 }}
        {{- end }}
        image: {{ include "ntfy.containerImage" . }}
        imagePullPolicy: {{ $ntfyContainer.image.pullPolicy }}
        ports:
        {{- range $ntfyContainerService.ports }}
        - name: {{ .name }}
          containerPort: {{ .containerPort }}
        {{- end }}
        env:
        {{- range $index, $secretName := $authSecretNames }}
        - name: {{ index $envList $index }}
          valueFrom:
            secretKeyRef:
              name: {{ $secretName }}
              key: {{ index $authSecretKeys $index }}
        {{- end }}
        {{- if $ntfyContainer.extraEnvs }}
        {{- $ntfyContainer.extraEnvs | toYaml | nindent 8 }}
        {{- end }}
        {{- if $ntfyContainer.resources }}
        resources: {{- $ntfyContainer.resources | toYaml | nindent 10 }}
        {{- end }}
        {{- if $ntfyContainerStartupProbe }}
        startupProbe: {{- $ntfyContainerStartupProbe | toYaml | nindent 10 }}
        {{- end }}
        {{- if $ntfyContainerReadinessProbe }}
        readinessProbe: {{- $ntfyContainerReadinessProbe | toYaml | nindent 10 }}
        {{- end }}
        {{- if $ntfyContainerLivenessProbe }}
        livenessProbe: {{- $ntfyContainerLivenessProbe | toYaml | nindent 10 }}
        {{- end }}
        volumeMounts:
        - name: config
          mountPath: /etc/ntfy-config
          readOnly: true
        - name: data
          mountPath: /var/lib/ntfy
        {{- if $ntfyContainer.extraVolumeMounts }}
        {{- $ntfyContainer.extraVolumeMounts | toYaml | nindent 8 }}
        {{- end }}
      {{- if .Values.extraContainers }}
      {{- .Values.extraContainers | toYaml | nindent 6 }}
      {{- end }}
      volumes:
      - name: config
        configMap:
          name: {{ include "ntfy.configMapName" . }}
          items:
          - key: {{ $serverConfig.configMapItemKey }}
            path: server.yaml
      - name: data
        {{- if $persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ include "ntfy.persistentVolumeClaimName" . }}
        {{- else }}
        emptyDir: {{ $persistence.emptyDir | toYaml | nindent 10 }}
        {{- end }}
      {{- if .Values.extraVolumes }}
      {{- .Values.extraVolumes | toYaml | nindent 6 }}
      {{- end }}
      {{- if .Values.nodeSelector }}
      nodeSelector: {{- .Values.nodeSelector | toYaml | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity: {{- .Values.affinity | toYaml | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations: {{- .Values.tolerations | toYaml | nindent 8 }}
      {{- end }}