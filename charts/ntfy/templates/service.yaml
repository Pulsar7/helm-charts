{{ include "ntfy.validateValues" . }}
{{- $service := .Values.service -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $service.serviceName }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "ntfy.labels" . | nindent 4 }}
spec:
  selector: {{- include "ntfy.selectorLabels" . | nindent 4 }}
  type: {{ $service.type }}
  ports:
  {{- range $name, $port := $service.ports }}
  - protocol: {{ $port.protocol }}
    port: {{ $port.portNumber }}
    targetPort: {{ .targetPort }}
    name: {{ $name }}
  {{- end }}
