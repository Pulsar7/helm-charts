#------------------------------------------------------------------------------
#
# Middlewares-Unittests Test-Suite for ntfy
#
# > https://github.com/helm-unittest/helm-unittest/blob/main/DOCUMENT.md
# 
#------------------------------------------------------------------------------
#
# Test suite name to show on test result output
suite: Test Middlewares
#
# The template files scope to test in this suite
# Only the selected files will be rendered
templates:
  - templates/middlewares.yaml
#
tests:
  - it: should not render any Middlewares resource
    set:
      ingressRoute.enabled: false
    asserts:
      - notExists:
          path: apiVersion
      - notExists:
          path: kind
  
  - it: should render one Middleware resource
    set:
      ingressRoute.enabled: true
      middlewares:
        - name: test-middleware
          spec:
            middlewareSpec: "1337"
    asserts:
      - isKind:
          of: Middleware
      - equal:
          path: metadata.name
          value: test-middleware
      - equal:
          path: spec
          value:
            middlewareSpec: "1337"