#------------------------------------------------------------------------------
#
# Middlewares-Unittests Test-Suite for ntfy
#
# > https://github.com/helm-unittest/helm-unittest/blob/main/DOCUMENT.md
# 
#------------------------------------------------------------------------------
suite: Test Middlewares
templates:
  - templates/middlewares.yaml
tests:
  - it: should not render any Middlewares resource
    set:
      ingressRoute:
        enabled: false
        entryPoints: ["test-entrypoint"]
        certResolver: "invalid-certresolver"
    asserts:
      - notExists:
          path: apiVersion
      - notExists:
          path: kind
  
  - it: should render one Middleware resource
    set:
      ingressRoute:
        enabled: true
        entryPoints: ["test-entrypoint"]
        certResolver: "invalid-certresolver"
      middlewares:
        testMiddleware:
          name: "test-middleware"
          spec:
            middlewareSpec: "1337"
    asserts:
      - isKind:
          of: Middleware
      - equal:
          path: metadata.name
          value: test-middleware
      - equal:
          path: spec
          value:
            middlewareSpec: "1337"