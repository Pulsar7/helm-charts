#------------------------------------------------------------------------------
#
# IngressRoute-Unittests Test-Suite for ntfy
#
# > https://github.com/helm-unittest/helm-unittest/blob/main/DOCUMENT.md
# 
#------------------------------------------------------------------------------
suite: Test IngressRoute
templates:
  - templates/ingressroute.yaml
tests:
  - it: should not render the IngressRoute resource
    set:
      ingressRoute:
        enabled: false
        entryPoints: ["test-entrypoint"]
        certResolver: "invalid-certresolver"
    asserts:
      - notExists:
          path: apiVersion
      - notExists:
          path: kind
  
  - it: should render the IngressRoute resource
    set:
      ingressRoute:
        enabled: true
        entryPoints: ["test-entrypoint"]
        certResolver: "invalid-certresolver"
    asserts:
      - isKind:
          of: IngressRoute
  
  - it: should render the IngressRoute resource with adjusted specs
    set:
      service:
        serviceName: "test-service"
        ports:
          http:
            portNumber: 7331
      ingressRoute:
        enabled: true
        routeMatch: Host(`test-host`)
        entryPoints: ["invalid-entrypoint"]
        certResolver: "invalid-certresolver"
      middlewares: {}
    asserts:
      - equal:
          path: spec.entryPoints
          value: ["invalid-entrypoint"]
      - equal:
          path: spec.routes[0].match
          value: Host(`test-host`)
      - equal:
          path: spec.routes[0].services[0].name
          value: "test-service"
      - equal:
          path: spec.routes[0].services[0].port
          value: 7331
      - notExists:
          path: spec.routes[0].middlewares
  
  - it: should render IngressRoute resource with a defined test-middleware
    set:
      ingressRoute:
        enabled: true
        entryPoints: ["test-entrypoint"]
        certResolver: "invalid-certresolver"
        routeMatch: "test"
      middlewares:
        exampleMiddleware:
          name: "example"
          spec:
            foo: baa
    asserts:
      - equal:
          path: spec.routes[0].middlewares
          value:
            - name: example
              namespace: NAMESPACE
  
  - it: should not render the enabled IngressRoute with missing entryPoints
    set:
      ingressRoute:
        enabled: true
        certResolver: "invalid-certresolver"
        routeMatch: "test"
        entryPoints: null
    asserts:
      - failedTemplate:
          errorPattern: "Missing required `.Values.ingressRoute.entryPoints`-Helm-Value. List cannot be empty."
  
  - it: should not render the enabled IngressRoute with missing routeMatch
    set:
      ingressRoute:
        enabled: true
        entryPoints: ["test-entrypoint"]
        certResolver: "invalid-certresolver"
        routeMatch: null
    asserts:
      - failedTemplate:
          errorPattern: "Missing required `.Values.ingressRoute.routeMatch`-Helm-Value."
  
  - it: should not render the enabled IngressRoute with missing certResolver
    set:
      ingressRoute:
        enabled: true
        entryPoints: ["test-entrypoint"]
        certResolver: null
        routeMatch: test
    asserts:
      - failedTemplate:
          errorPattern: "Missing required `.Values.ingressRoute.certResolver`-Helm-Value."