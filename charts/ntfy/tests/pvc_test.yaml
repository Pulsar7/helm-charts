#------------------------------------------------------------------------------
#
# PVC-Unittests Test-Suite for ntfy
#
# > https://github.com/helm-unittest/helm-unittest/blob/main/DOCUMENT.md
# 
#------------------------------------------------------------------------------
#
# Test suite name to show on test result output
suite: Test PersistentVolumeClaim
#
# The template files scope to test in this suite
# Only the selected files will be rendered
templates:
  - templates/pvc.yaml
#
tests:
  - it: should not render the PVC with disabled persistence
    set:
      persistence.enabled: false
    asserts:
      - notExists:
          path: apiVersion
      - notExists:
          path: kind

  - it: should not render the PVC with enabled persistence but existing PVC
    set:
      persistence.persistentVolumeClaim:
        useExistingPVC: true
    asserts:
      - notExists:
          path: apiVersion
      - notExists:
          path: kind
  
  - it: should render the PVC by default
    asserts:
      - isKind:
          of: PersistentVolumeClaim
  
  - it: should render the PVC with adjusted Claim-name
    set:
      persistence.persistentVolumeClaim:
        claimName: "test-claim"
    asserts:
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: metadata.name
          value: "test-claim"
  
  - it: should render the PVC with adjusted specs
    set:
      persistence.persistentVolumeClaim:
        storageClassName: "invalid-storageClass"
        accessModes: ["invalidAccessMode"]
        storageRequest: "1337Gi"
    asserts:
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: spec.storageClassName
          value: "invalid-storageClass"
      - equal:
          path: spec.accessModes
          value: ["invalidAccessMode"]
      - equal:
          path: spec.resources.requests.storage
          value: "1337Gi"

  - it: should render the PVC with additional specs-fields
    set:
      persistence.persistentVolumeClaim:
        extraSpecs:
          invalidPVCSpec: true
          justAnotherObject:
            hello: "hello world"
    asserts:
      - isKind:
          of: PersistentVolumeClaim
      - isSubset:
          path: spec
          content:
            invalidPVCSpec: true
            justAnotherObject:
              hello: "hello world"