#------------------------------------------------------------------------------
#
# Secrets-Unittests Test-Suite for ntfy
#
# > https://github.com/helm-unittest/helm-unittest/blob/main/DOCUMENT.md
# 
#------------------------------------------------------------------------------
#
# Test suite name to show on test result output
suite: Test Secrets
#
# The template files scope to test in this suite
# Only the selected files will be rendered
templates:
  - templates/secrets.yaml
#
tests:
  - it: should render authTokens Secret-resource by default
    documentIndex: 0
    asserts:
      - isKind:
          of: Secret
      - exists:
          path: stringData

  - it: should render authUsers Secret-resource by default
    documentIndex: 1
    asserts:
      - isKind:
          of: Secret
      - exists:
          path: stringData
    
  - it: should render authAccess Secret-resource by default
    documentIndex: 2
    asserts:
      - isKind:
          of: Secret
      - exists:
          path: stringData

  - it: should not render any Secret-resource
    set:
      authentication:
        authTokens:
          useExistingSecret: true
        authUsers:
          useExistingSecret: true
        authAccess:
          useExistingSecret: true
    asserts:
      - notExists:
          path: apiVersion
      - notExists:
          path: kind
  
  - it: should render only the authTokens-Secret-resource
    set:
      authentication:
        authTokens:
          secretName: "authTokens-test-secret"
          secretKey: "authTokensTestKey"
          defaultSecretValue: "test-default-authTokens-secret-value"
        authUsers:
          useExistingSecret: true
        authAccess:
          useExistingSecret: true
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: stringData
          value:
            authTokensTestKey: test-default-authTokens-secret-value
  
  - it: should render only the authUsers-Secret-resource
    set:
      authentication:
        authTokens:
          useExistingSecret: true
        authUsers:
          secretName: "authUsers-test-secret"
          secretKey: "authUsersTestKey"
          defaultSecretValue: "test-default-authUsers-secret-value"
        authAccess:
          useExistingSecret: true
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: stringData
          value:
            authUsersTestKey: test-default-authUsers-secret-value
  
  - it: should render only the authAccess-Secret-resource
    set:
      authentication:
        authTokens:
          useExistingSecret: true
        authUsers:
          useExistingSecret: true
        authAccess:
          secretName: "authAccess-test-secret"
          secretKey: "authAccessTestKey"
          defaultSecretValue: "test-default-authAccess-secret-value"
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: stringData
          value:
            authAccessTestKey: test-default-authAccess-secret-value