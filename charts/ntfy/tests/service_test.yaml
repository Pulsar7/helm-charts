#------------------------------------------------------------------------------
#
# Service-Unittests Test-Suite for ntfy
#
# > https://github.com/helm-unittest/helm-unittest/blob/main/DOCUMENT.md
# 
#------------------------------------------------------------------------------
#
# Test suite name to show on test result output
suite: Test Service
#
# The template files scope to test in this suite
# Only the selected files will be rendered
templates:
  - templates/service.yaml
#
tests:
  - it: should render Service with adjusted specs
    set:
      service:
        serviceName: "test-service"
        type: InvalidServiceType
        ports:
          http:
            portNumber: 1337
            targetPort: http
            protocol: InvalidProtocol
          foo:
            portNumber: 7331
            targetPort: foo
            protocol: baa
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: test-service
      - equal:
          path: spec.type
          value: InvalidServiceType
      - equal:
          path: spec.ports
          value:
            - protocol: baa
              port: 7331
              targetPort: foo
              name: foo
            - protocol: InvalidProtocol
              port: 1337
              targetPort: http
              name: http