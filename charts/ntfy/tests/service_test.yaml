#------------------------------------------------------------------------------
#
# Service-Unittests Test-Suite for ntfy
#
# > https://github.com/helm-unittest/helm-unittest/blob/main/DOCUMENT.md
# 
#------------------------------------------------------------------------------
#
# Test suite name to show on test result output
suite: Test Service
#
# The template files scope to test in this suite
# Only the selected files will be rendered
templates:
  - templates/service.yaml
#
tests:
  - it: should render Service with default specs
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: ntfy-http
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports
          value:
            - protocol: TCP
              port: 5000
              targetPort: http
              name: http
  
  - it: should render Service with adjusted specs
    set:
      ntfyContainer.service:
        serviceName: test-ntfy-http-service-name
        type: InvalidServiceType
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: test-ntfy-http-service-name
      - equal:
          path: spec.type
          value: InvalidServiceType